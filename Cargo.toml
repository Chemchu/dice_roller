[package]
name = "dice_roller"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.11.0"
actix-files = "0.6.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
askama = { version = "0.14" }
askama_actix = "0.15.0"
env_logger = "0.11.5"
strum = "0.27.1"
strum_macros = "0.27.1"
pulldown-cmark = "0.13"
reqwest = { version = "0.12", features = ["json"] }
dotenv = "0.15.0"
time = { version = "0.3.4", features = ["serde"] }
cached = "0.55.1"

