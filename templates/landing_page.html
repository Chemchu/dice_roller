<div class="bg-black/20">
  <div id="content" class="min-h-full min-w-full">
    <div
      class="bg-gradient-to-br from-purple-900 via-blue-900 to-indigo-900 min-h-screen flex items-center justify-center p-4"
    >
      <div
        class="bg-white/10 backdrop-blur-lg rounded-3xl shadow-2xl p-8 max-w-md w-full border border-white/20"
      >
        <div class="text-center mb-8">
          <h1 class="text-4xl font-bold text-white mb-2">Dice Roller</h1>
          <p class="text-blue-200">Para jugar a Vampiro</p>
        </div>

        <!-- IMPORTANT: Added hx-boost="false" to prevent HTMX interference -->
        <form id="diceForm" class="space-y-6" hx-boost="false">
          <!-- Number of Dice -->
          <div class="space-y-2">
            <label
              for="numDice"
              class="block text-sm font-medium text-blue-100"
            >
              Número de dados
            </label>
            <input
              type="number"
              id="numDice"
              min="1"
              max="20"
              value="1"
              class="w-full px-4 py-3 bg-white/20 border border-white/30 rounded-xl text-white placeholder-blue-200 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition-all duration-300"
              placeholder="Insira o número de dados"
            />
          </div>

          <!-- Dice Sides -->
          <div class="space-y-2">
            <label
              for="diceType"
              class="block text-sm font-medium text-blue-100"
            >
              Número de caras
            </label>
            <input
              type="number"
              id="diceType"
              min="2"
              max="100"
              value="10"
              class="w-full px-4 py-3 bg-white/20 border border-white/30 rounded-xl text-white placeholder-blue-200 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition-all duration-300"
              placeholder="Número de lados (ex: 6, 10, 20)"
            />
          </div>

          <!-- Difficulty (Optional) -->
          <div class="space-y-2">
            <label
              for="difficulty"
              class="block text-sm font-medium text-blue-100"
            >
              Dificultad
            </label>
            <input
              type="number"
              id="difficulty"
              min="2"
              max="10"
              value="6"
              class="w-full px-4 py-3 bg-white/20 border border-white/30 rounded-xl text-white placeholder-blue-200 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition-all duration-300"
              placeholder="Número alvo para sucesso"
            />
          </div>

          <!-- Roll Button -->
          <button
            type="submit"
            class="w-full bg-gradient-to-r from-pink-500 to-violet-500 hover:from-pink-600 hover:to-violet-600 text-white font-bold py-4 px-6 rounded-xl transition-all duration-300 transform hover:scale-105 hover:shadow-xl focus:outline-none focus:ring-2 focus:ring-violet-400 active:scale-95"
          >
            Lanzar Dados!
          </button>
        </form>

        <!-- Modal Overlay -->
        <div
          id="modalOverlay"
          class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4"
        >
          <!-- Modal Content -->
          <div
            id="modalContent"
            class="bg-gradient-to-br from-purple-800/90 to-blue-800/90 backdrop-blur-lg rounded-3xl shadow-2xl p-8 max-w-lg w-full border border-white/30 transform transition-all duration-300 scale-95 opacity-0"
          >
            <!-- Close Button -->
            <button
              id="closeModal"
              class="absolute top-4 right-4 text-white/70 hover:text-white transition-colors duration-200"
            >
              <svg
                class="w-6 h-6"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M6 18L18 6M6 6l12 12"
                ></path>
              </svg>
            </button>

            <!-- Results Section -->
            <div id="results">
              <h3 class="text-3xl font-bold text-white mb-6 text-center">
                🎲 Resultados
              </h3>
              <div
                id="diceResults"
                class="flex flex-wrap justify-center gap-3 mb-6"
              ></div>
              <div class="text-center space-y-4">
                <div class="bg-white/10 rounded-xl p-4 border border-white/20">
                  <p class="text-blue-200 text-sm mb-1">Total:</p>
                  <p
                    id="totalResult"
                    class="text-3xl font-bold text-yellow-300"
                  ></p>
                </div>
                <div
                  id="successInfo"
                  class="bg-white/10 rounded-xl p-4 border border-white/20"
                >
                  <p class="text-blue-200 text-sm mb-1">Éxitos:</p>
                  <p
                    id="successCount"
                    class="text-3xl font-bold text-green-300"
                  ></p>
                </div>
              </div>

              <!-- Modal Buttons -->
              <div class="flex gap-4 mt-6">
                <button
                  id="rollAgain"
                  class="flex-1 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-bold py-3 px-6 rounded-xl transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-emerald-400 active:scale-95"
                >
                  🎲 Lanzar otra vez
                </button>
                <button
                  id="closeModalBtn"
                  class="flex-1 bg-gradient-to-r from-gray-500 to-gray-600 hover:from-gray-600 hover:to-gray-700 text-white font-bold py-3 px-6 rounded-xl transition-all duration-300 transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-gray-400 active:scale-95"
                >
                  ✕ Cerrar
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        // Wait for DOM to be fully loaded
        document.addEventListener("DOMContentLoaded", function () {
          const diceForm = document.getElementById("diceForm");
          const results = document.getElementById("results");
          const diceResults = document.getElementById("diceResults");
          const totalResult = document.getElementById("totalResult");
          const successInfo = document.getElementById("successInfo");
          const successCount = document.getElementById("successCount");
          const rollAgainBtn = document.getElementById("rollAgain");
          const modalOverlay = document.getElementById("modalOverlay");
          const modalContent = document.getElementById("modalContent");
          const closeModal = document.getElementById("closeModal");
          const closeModalBtn = document.getElementById("closeModalBtn");

          function rollDice(sides) {
            return Math.floor(Math.random() * sides) + 1;
          }

          function getDiceEmoji(result, sides) {
            if (sides === 6) {
              const diceEmojis = ["⚀", "⚁", "⚂", "⚃", "⚄", "⚅"];
              return diceEmojis[result - 1];
            }
            return result.toString();
          }

          function getDiceColor(roll, difficulty, sides) {
            if (sides === 10 && roll === 1) {
              return "bg-red-500/60 border-red-400"; // Botch in Vampire
            } else if (roll >= difficulty) {
              return "bg-green-500/60 border-green-400"; // Success
            } else {
              return "bg-white/30 border-white/30"; // Failure
            }
          }

          function showModal() {
            modalOverlay.classList.remove("hidden");
            modalOverlay.classList.add("flex");

            // Trigger animation
            setTimeout(() => {
              modalContent.classList.remove("scale-95", "opacity-0");
              modalContent.classList.add("scale-100", "opacity-100");
            }, 10);
          }

          function hideModal() {
            modalContent.classList.remove("scale-100", "opacity-100");
            modalContent.classList.add("scale-95", "opacity-0");

            setTimeout(() => {
              modalOverlay.classList.remove("flex");
              modalOverlay.classList.add("hidden");
            }, 300);
          }

          function animateDice() {
            const diceElements = diceResults.querySelectorAll(".dice-result");
            diceElements.forEach((dice, index) => {
              setTimeout(() => {
                dice.style.transform = "scale(1.1) rotate(360deg)";
                setTimeout(() => {
                  dice.style.transform = "scale(1) rotate(0deg)";
                }, 600);
              }, index * 100);
            });
          }

          function performRoll() {
            console.log("Performing roll..."); // Debug log

            const numDice = parseInt(document.getElementById("numDice").value);
            const diceType = parseInt(
              document.getElementById("diceType").value,
            );
            const difficulty = parseInt(
              document.getElementById("difficulty").value,
            );

            console.log(
              `Rolling ${numDice} d${diceType} with difficulty ${difficulty}`,
            ); // Debug log

            let total = 0;
            let rolls = [];
            let successes = 0;
            let botches = 0;

            // Roll all dice
            for (let i = 0; i < numDice; i++) {
              const roll = rollDice(diceType);
              rolls.push(roll);
              total += roll;

              // Calculate successes (Vampire: The Masquerade rules)
              if (diceType === 10) {
                if (roll === 1) {
                  botches++;
                } else if (roll >= difficulty) {
                  successes++;
                  if (roll === 10) successes++; // 10s count as two successes
                }
              } else {
                // Standard success counting for other dice types
                if (roll >= difficulty) {
                  successes++;
                }
              }
            }

            console.log("Rolls:", rolls); // Debug log

            // Clear previous results
            diceResults.innerHTML = "";

            // Display individual dice results
            rolls.forEach((roll, index) => {
              const diceElement = document.createElement("div");
              const colorClass = getDiceColor(roll, difficulty, diceType);

              diceElement.className = `dice-result ${colorClass} border-2 rounded-lg p-3 text-center min-w-[60px] transform transition-all duration-500 ease-in-out`;

              const emoji = getDiceEmoji(roll, diceType);
              diceElement.innerHTML = `
            <div class="text-2xl mb-1">${diceType === 6 ? emoji : "🎲"}</div>
            <div class="text-lg font-bold text-white">${roll}</div>
          `;

              diceResults.appendChild(diceElement);
            });

            // Display results
            totalResult.textContent = total;
            successCount.textContent =
              diceType === 10 && botches > 0 && successes === 0
                ? `${successes} (Botch!)`
                : successes;

            // Show modal and animate dice
            showModal();
            setTimeout(animateDice, 100);
          }

          // Modal event listeners
          if (closeModal) {
            closeModal.addEventListener("click", hideModal);
          }

          if (closeModalBtn) {
            closeModalBtn.addEventListener("click", hideModal);
          }

          // Close modal when clicking outside
          if (modalOverlay) {
            modalOverlay.addEventListener("click", function (e) {
              if (e.target === modalOverlay) {
                hideModal();
              }
            });
          }

          // Close modal with Escape key
          document.addEventListener("keydown", function (e) {
            if (
              e.key === "Escape" &&
              !modalOverlay.classList.contains("hidden")
            ) {
              hideModal();
            }
          });

          // Event listeners with better error handling
          if (diceForm) {
            diceForm.addEventListener("submit", function (e) {
              console.log("Form submitted"); // Debug log
              e.preventDefault();
              e.stopPropagation();
              performRoll();
              return false;
            });
          }

          if (rollAgainBtn) {
            rollAgainBtn.addEventListener("click", function (e) {
              console.log("Roll again clicked"); // Debug log
              e.preventDefault();
              e.stopPropagation();
              performRoll(); // This will show new results in the modal
              return false;
            });
          }

          // Add some keyboard shortcuts
          document.addEventListener("keydown", function (e) {
            if (e.key === "Enter" && e.ctrlKey) {
              e.preventDefault();
              performRoll();
            }
            if (
              e.key === "r" &&
              e.ctrlKey &&
              !modalOverlay.classList.contains("hidden")
            ) {
              e.preventDefault();
              performRoll();
            }
          });

          console.log("Dice roller initialized"); // Debug log
        });
      </script>
    </div>
  </div>
</div>
