<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFF" />
    <title>{% block title %}{{ title }}{% endblock %}</title>

    <script src="/_static/htmx.min.js"></script>

    <link rel="stylesheet" href="/_static/compiled.css" />
    <link rel="icon" type="image/x-icon" href="/_static/favicon.ico" />

    <link rel="manifest" href="/_static/manifest.json" />

    <meta name="description" content="Dice Roller" />
    <meta name="view-transition" content="same-origin" />
  </head>

  <body hx-boost="true" class="w-full h-full text-white bg-neutral-900">
    <!-- Main Content -->
    <main class="bg-black/20">
      <div id="content" class="min-h-full min-w-full">
        {% block content %}{% endblock %}
      </div>
    </main>
  </body>
</html>
